info:
  name: send code
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/auth/send-code"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "example@example.com",
        "code_type": "test"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
