info:
  name: get sse token
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/:pollSlug/connection/token"
  params:
    - name: pollSlug
      value: test
      type: path
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setEnvVar('sseToken', encodeURIComponent(JSON.stringify({"token": res.body.token})))
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
