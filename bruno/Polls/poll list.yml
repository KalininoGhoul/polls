info:
  name: poll list
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/polls?page=1&per_page=10&sort_by=published_at&sort_direction=desc"
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "10"
      type: query
    - name: sort_by
      value: published_at
      type: query
    - name: sort_direction
      value: desc
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
