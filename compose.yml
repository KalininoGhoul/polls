services:
  nginx:
    image: polls-nginx
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    volumes:
      - ./docker/nginx/config/upstreams:/etc/nginx/upstreams
      - ./docker/nginx/config/locations:/etc/nginx/locations
      - /etc/pki/tls/certs/localhost.crt:/etc/certs/localhost.crt
      - /etc/pki/tls/private/localhost.key:/etc/certs/localhost.key
      - ./backend/public/vendor:/var/www/html/vendor
      - ./backend/storage/app/public/:/var/www/html/storage
      - type: tmpfs
        target: /tmp/nginx_cache
    environment:
      HOST: "localhost"
      TLS_CERT: "localhost.crt"
      TLS_CERT_KEY: "localhost.key"
      WORKER_PROCESSES: 6
      WORKER_RLIMIT_NOFILE: 1024
      FASTCGI_CACHE_MAX_SIZE: "50m"
    depends_on:
      - app

  app:
    image: polls-php
    volumes:
      - ./backend:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PHP_IDE_CONFIG: "serverName=localhost"
      XDEBUG_SESSION: "1"
      RR_DEBUG: "true"
      RR_HTTP_NUM_WORKERS: "1"
      CENTRIFUGAL_CLIENT_TOKEN_SECRET: "6fe1a04d7da675316c16f089c7631e3256921a7b5b8afdd21c88107d3fd9e0b1"
    depends_on:
      - postgres
      - centrifugo

  postgres:
    image: postgres:18.3
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "db"
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "pass"
    volumes:
      - postgres:/var/lib/postgresql/18/docker

  centrifugo:
    image: centrifugo/centrifugo:v6.8
    environment:
      CENTRIFUGO_UNI_SSE_ENABLED: "true"
      CENTRIFUGO_WEBSOCKET_DISABLED: "true"
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: "6fe1a04d7da675316c16f089c7631e3256921a7b5b8afdd21c88107d3fd9e0b1"
      CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_ALLOW_SUBSCRIBE_FOR_ANONYMOUS: "true"
      CENTRIFUGO_LOG_LEVEL: "debug"
      CENTRIFUGO_HTTP_API_KEY: "api-key"
    ulimits:
      nofile:
        soft: 1024
        hard: 1024

volumes:
  postgres:
