services:
  nginx:
    image: polls-nginx
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    volumes:
      - ./docker/nginx/config/upstreams:/etc/nginx/upstreams
      - ./docker/nginx/config/locations:/etc/nginx/locations
      - /etc/pki/tls/certs/localhost.crt:/etc/certs/localhost.crt
      - /etc/pki/tls/private/localhost.key:/etc/certs/localhost.key
    environment:
      HOST: "localhost"
      WORKER_PROCESSES: 6
      WORKER_RLIMIT_NOFILE: 1024
      FASTCGI_CACHE_MAX_SIZE: "50m"
    depends_on:
      - app

  app:
    image: polls-php-dev
    volumes:
      - ./backend:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PHP_IDE_CONFIG: "serverName=localhost"
      XDEBUG_SESSION: "1"
      RR_DEBUG: "true"
      RR_HTTP_NUM_WORKERS: "1"

  postgres:
    image: postgres:18.3
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "db"
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "pass"
    volumes:
      - postgres:/var/lib/postgresql/18/docker

volumes:
  postgres:
